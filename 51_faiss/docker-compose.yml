---

name: fedora_faiss

# Define the GPU deployment configuration alias
x-gpu-deploy-config: &gpu-deploy-config
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            count: all # Use 'all' GPUs for the test
            capabilities: [gpu]


services:
  fedora-40-faiss:
    image: tolland/fedora-41-faiss-gpu:latest
    pull_policy: build
    build:
      context: ./context
      dockerfile: ../fedora-40-gpu/Dockerfile
    <<: *gpu-deploy-config
    profiles:
      - build
      - f40

  fedora-41-faiss-builder:
    image: tolland/fedora-41-faiss-builder:latest
    pull_policy: build
    build:
      context: ./context
      dockerfile: ../fedora-41-faiss-builder/Dockerfile

#  fedora-41-faiss-gpu:
#    image: tolland/fedora-41-faiss-whl:latest
#    pull_policy: build
#    build:
#      context: ./context
#      dockerfile: ../fedora-41-gpu/Dockerfile
#    depends_on:
#      - fedora-41-faiss-builder
#    profiles:
#      - build

  fedora-41-faiss-test:
    <<: *gpu-deploy-config
    image: tolland/fedora-41-faiss-test:latest
    pull_policy: build
    build:
      context: ./context
      dockerfile: ../fedora-41-faiss-test/Dockerfile
    depends_on:
      - fedora-41-faiss-builder
    profiles:
      - build

  fedora-41-faiss-work:
    image: tolland/fedora-41-faiss-builder:latest
    pull_policy: build
    user: ${FAISS_BUILD_USER:-1000}:${FAISS_BUILD_GROUP:-1000}
    command: top -b
    volumes:
      - ./third_party/faiss:/faiss:z
      - ./third_party/faiss_install:/app:z
      - ./scripts:/scripts:z
      - ~/git/faiss-proj:/tmp/faiss-proj:z
      # - ./context/build.sh:/scripts/build.sh:z

  fedora-41-faiss-no-gpu:
    image: tolland/fedora-41-faiss-no-gpu:latest
    pull_policy: build
    build:
      context: ./context
      dockerfile: ../fedora-41-git-checkout/Dockerfile
    command: top -b
    depends_on:
      - fedora-41-faiss-builder
    volumes:
      - /srv/image_builder/build:/build/faiss-builder/build
    profiles:
      - build

  fedora-41-faiss-gpu:
    <<: *gpu-deploy-config
    image: tolland/fedora-41-faiss-gpu:latest
    pull_policy: build
    build:
      context: ./context
      dockerfile: ../fedora-41-git-checkout/Dockerfile
    command: top -b
    depends_on:
      - fedora-41-faiss-builder
    volumes:
      - /srv/image_builder/build:/build/faiss-builder/build
    profiles:
      - build

  fedora-41-faiss-build:
    image: tolland/fedora-41-faiss-git-checkout:latest
    pull_policy: build
    build:
      context: ./context
      dockerfile: ../fedora-41-git-checkout/Dockerfile
    command: top -b
    volumes:
      - type: bind
        source: ${PWD}/build/dists
        target: /build/faiss-builder/build/dists:z
        bind:
          selinux: z
    profiles:
      - build
